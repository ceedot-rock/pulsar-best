name: Audited checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests + release roundtrip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests (lib)
        run: cargo test --lib
      - name: Release build
        run: cargo build --release
      - name: Encode/decode roundtrip (byte-identical)
        run: |
          set -e
          python3 -c "open('fixture.bin','wb').write(bytes(range(256))*400)"
          ./target/release/pulsar encode fixture.bin -o fixture.pulsar
          ./target/release/pulsar decode fixture.pulsar -o fixture.back
          cmp fixture.bin fixture.back && echo "roundtrip byte-identical"

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for committed secrets
        run: |
          set -e
          echo "Scanning for common secret patterns..."
          ! grep -rnE "AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|BEGIN [A-Z ]*PRIVATE KEY|sk_(live|test)_[A-Za-z0-9]+|xox[bap]-[A-Za-z0-9-]+|-----BEGIN" \
            --include="*.rs" --include="*.toml" --include="*.txt" --include="*.md" --include="*.yml" --exclude="audited-checks.yml" .
          echo "No secrets found."
